  <!-- FIREBASE CONFIG & TỰ SINH ICON/LOGO/PWA MANIFEST CHUẨN ĐIỆN THOẠI -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB3hvtNC84KNTUWNP5YON4jvQqRWJwqXBU",
      authDomain: "ventech-cp-report.firebaseapp.com",
      projectId: "ventech-cp-report",
      storageBucket: "ventech-cp-report.firebasestorage.app",
      messagingSenderId: "1011272600888",
      appId: "1:1011272600888:web:05635e93cf592eed5405cd",
      measurementId: "G-6TF4DV4FJ4"
    };
    
    let db = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.firestore();
      console.log("Firebase kết nối thành công!");
    } catch(e) {
      console.warn("Chạy offline / LocalStorage mode do lỗi Firebase:", e);
    }

    let VENTECH_LOGO_BASE64 = "";
    let VENTECH_ICON_BASE64 = "";

    function generateVentechAssets() {
      // 1. Sinh Logo ngang
      const canvas = document.createElement("canvas");
      canvas.width = 400; canvas.height = 100;
      const ctx = canvas.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, 400, 100);

      const cx = 50, cy = 50, r = 36;
      ctx.fillStyle = "#0284c7";
      for (let i = -3; i <= 3; i++) {
        for (let j = -3; j <= 3; j++) {
          const x = cx + i * 10;
          const y = cy + j * 10;
          if (Math.hypot(x - cx, y - cy) <= r) {
            ctx.beginPath();
            ctx.arc(x, y, 3.2, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      ctx.font = "bold 44px Arial, sans-serif";
      ctx.fillStyle = "#0284c7";
      ctx.fillText("Ventech", 105, 56);
      ctx.font = "bold 14px Arial, sans-serif";
      ctx.fillText("®", 280, 28);

      ctx.fillStyle = "#dc2626";
      ctx.fillRect(105, 64, 270, 3.5);

      ctx.font = "normal 16px Arial, sans-serif";
      ctx.fillStyle = "#475569";
      ctx.fillText("venus networks technology", 108, 86);

      VENTECH_LOGO_BASE64 = canvas.toDataURL("image/png");

      // 2. Sinh App Icon hình vuông (Dành cho iOS & Android Icon)
      const iconCanvas = document.createElement("canvas");
      iconCanvas.width = 192; iconCanvas.height = 192;
      const ictx = iconCanvas.getContext("2d");
      ictx.fillStyle = "#0284c7";
      ictx.fillRect(0, 0, 192, 192);

      // Chữ Ventech V viết tắt phong cách hiện trường
      ictx.fillStyle = "#ffffff";
      ictx.font = "bold 96px Arial, sans-serif";
      ictx.textAlign = "center";
      ictx.textBaseline = "middle";
      ictx.fillText("V", 96, 90);

      ictx.fillStyle = "#dc2626";
      ictx.fillRect(36, 145, 120, 8);

      VENTECH_ICON_BASE64 = iconCanvas.toDataURL("image/png");

      // Gắn Apple Touch Icon cho Safari iPhone
      const appleIconLink = document.createElement("link");
      appleIconLink.rel = "apple-touch-icon";
      appleIconLink.href = VENTECH_ICON_BASE64;
      document.head.appendChild(appleIconLink);

      // Tạo PWA Web App Manifest trực tiếp qua Blob
      const manifestObj = {
        name: "VENTECH - Báo Cáo Tiến Độ CP",
        short_name: "Ventech CP",
        start_url: window.location.href,
        display: "standalone",
        background_color: "#0284c7",
        theme_color: "#0284c7",
        icons: [{
          src: VENTECH_ICON_BASE64,
          sizes: "192x192",
          type: "image/png"
        }]
      };
      const manifestBlob = new Blob([JSON.stringify(manifestObj)], { type: "application/json" });
      const manifestUrl = URL.createObjectURL(manifestBlob);
      const manifestLink = document.createElement("link");
      manifestLink.rel = "manifest";
      manifestLink.href = manifestUrl;
      document.head.appendChild(manifestLink);
    }
    generateVentechAssets();
  </script>

  <!-- SCRIPT LOGIC TOÀN BỘ HỆ THỐNG -->
  <script>
    const DEFAULT_SITES = [
      { id: "baogiang", code: "19", name: "TRẠI BẢO GIANG", tech: "Nguyễn Văn Tuấn", phone: "0912.345.678" },
      { id: "minhthien3", code: "20", name: "TRẠI MINH THIỆN 3", tech: "Trần Đình Khang", phone: "0908.123.456" },
      { id: "iapa", code: "21", name: "TRẠI IAPA", tech: "Lê Hoàng Phúc", phone: "0934.567.890" },
      { id: "doixanh", code: "22", name: "TRẠI ĐỒI XANH", tech: "Phạm Quốc Huy", phone: "0945.678.901" },
      { id: "nhattran", code: "23", name: "TRẠI NHẤT TRẦN", tech: "Võ Văn Kiệt", phone: "0987.654.321" },
      { id: "navifarm", code: "24", name: "TRẠI NAVIFARM", tech: "Đặng Minh Tâm", phone: "0978.112.233" }
    ];

    const DEFAULT_STAGE1 = [
      { code: "I.1", name: "Khảo sát vị trí lắp Camera", default: 100 },
      { code: "I.2", name: "Nhân công và hàng hóa tập kết tại trại (cách ly 24h - 48h)", default: 100 },
      { code: "I.3", name: "Dựng trụ lắp camera GĐ 1 cho các vị trí chính (theo tiêu chuẩn C.P)", default: 100 },
      { code: "I.4", name: "Kéo cáp Cat6, cáp điện chính thức; kéo cáp quang tạm", default: 100 },
      { code: "I.5", name: "Lắp tủ Rack, Tủ EB", default: 100 },
      { code: "I.6", name: "Hàn quang, đấu nối tạm", default: 100 },
      { code: "I.7", name: "Lắp camera theo tiêu chuẩn của C.P", default: 100 },
      { code: "I.8", name: "Lên hình Camera", default: 100 }
    ];

    const DEFAULT_STAGE2 = [
      { code: "II.1", name: "Nhân công và hàng hóa tập kết tại trại (cách ly 24h - 48h)", default: 100 },
      { code: "II.2", name: "Kiểm tra toàn bộ, hoàn thiện lại hệ thống cáp quang theo tiêu chuẩn C.P", default: 40 },
      { code: "II.3", name: "Cấu hình hệ thống, camera hoàn chỉnh theo yêu cầu của C.P", default: 0 },
      { code: "II.4", name: "Nghiệm thu nội bộ từng trại", default: 0 },
      { code: "II.5", name: "Nghiệm thu với Chủ đầu tư", default: 0 }
    ];

    const DEFAULT_USERS = [
      { u: "admin", p: "admin123", role: "superadmin", name: "Super Admin (Tổng Chỉ Huy)", allowedSites: ["*"] },
      { u: "adminsite1", p: "123456", role: "adminsite", name: "Admin Cụm 1", allowedSites: ["baogiang", "minhthien3", "iapa"] },
      { u: "adminsite2", p: "123456", role: "adminsite", name: "Admin Cụm 2", allowedSites: ["doixanh", "nhattran", "navifarm"] },
      { u: "baogiang", p: "123456", role: "site", siteId: "baogiang", name: "Site Bảo Giang" },
      { u: "minhthien3", p: "123456", role: "site", siteId: "minhthien3", name: "Site Minh Thiện 3" },
      { u: "iapa", p: "123456", role: "site", siteId: "iapa", name: "Site IaPa" },
      { u: "doixanh", p: "123456", role: "site", siteId: "doixanh", name: "Site Đồi Xanh" },
      { u: "nhattran", p: "123456", role: "site", siteId: "nhattran", name: "Site Nhất Trần" },
      { u: "navifarm", p: "123456", role: "site", siteId: "navifarm", name: "Site NaviFarm" }
    ];

    let currentUser = JSON.parse(localStorage.getItem("ventech_user")) || null;
    let selectedDate = new Date().toISOString().split("T")[0];
    let inspectingSiteId = null;

    let siteSearchKeyword = "";
    let siteFilterStatus = "all"; // all, submitted, pending

    let appData = JSON.parse(localStorage.getItem("ventech_db")) || {
      sites: DEFAULT_SITES,
      stage1Template: DEFAULT_STAGE1,
      stage2Template: DEFAULT_STAGE2,
      users: DEFAULT_USERS,
      reports: {}
    };

    if (!appData.sites) appData.sites = DEFAULT_SITES;
    if (!appData.stage1Template) appData.stage1Template = DEFAULT_STAGE1;
    if (!appData.stage2Template) appData.stage2Template = DEFAULT_STAGE2;
    if (!appData.users) appData.users = DEFAULT_USERS;

    function calculateSiteAvgStage1(rep) {
      if (!rep || !rep.stage1) return 100;
      const vals = Object.values(rep.stage1).map(Number);
      if (!vals.length) return 100;
      return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
    }

    function calculateSiteAvgStage2(rep) {
      if (!rep || !rep.stage2) return 0;
      const vals = Object.values(rep.stage2).map(Number);
      if (!vals.length) return 0;
      return Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
    }

    function ensureDayReport(dateKey) {
      if (!appData.reports[dateKey]) appData.reports[dateKey] = {};
      appData.sites.forEach(site => {
        if (!appData.reports[dateKey][site.id]) {
          const prevDates = Object.keys(appData.reports).filter(d => d < dateKey).sort();
          let prevProgress1 = {}, prevProgress2 = {}, prevStagesEnabled = { stage1: true, stage2: true };
          if (prevDates.length > 0) {
            const lastD = prevDates[prevDates.length - 1];
            if (appData.reports[lastD][site.id]) {
              prevProgress1 = { ...appData.reports[lastD][site.id].stage1 };
              prevProgress2 = { ...appData.reports[lastD][site.id].stage2 };
              if (appData.reports[lastD][site.id].stagesEnabled) {
                prevStagesEnabled = { ...appData.reports[lastD][site.id].stagesEnabled };
              }
            }
          }
          appData.reports[dateKey][site.id] = {
            submitted: false,
            submitTime: "",
            stagesEnabled: prevStagesEnabled,
            stage1: Object.keys(prevProgress1).length ? prevProgress1 : appData.stage1Template.reduce((acc, cur) => ({ ...acc, [cur.code]: cur.default }), {}),
            stage2: Object.keys(prevProgress2).length ? prevProgress2 : appData.stage2Template.reduce((acc, cur) => ({ ...acc, [cur.code]: cur.default }), {}),
            images: [],
            issues: "Quy trình cách ly nghiêm ngặt; Thời gian di chuyển giữa các trại xa; Thời tiết mưa chiều ảnh hưởng kéo cáp.",
            planNext: "Tiếp tục hoàn thiện các vị trí camera, kéo cáp quang và đấu nối tủ EB."
          };
        } else {
          if (!appData.reports[dateKey][site.id].stagesEnabled) {
            appData.reports[dateKey][site.id].stagesEnabled = { stage1: true, stage2: true };
          }
        }
      });
    }
    ensureDayReport(selectedDate);

    function saveAllData(silent = true) {
      localStorage.setItem("ventech_db", JSON.stringify(appData));
      if (db) {
        db.collection("daily_reports").doc("system_config").set({
          sites: appData.sites,
          stage1Template: appData.stage1Template,
          stage2Template: appData.stage2Template,
          users: appData.users,
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true });

        db.collection("daily_reports").doc(selectedDate).set({
          date: selectedDate,
          reports: appData.reports[selectedDate],
          updatedAt: firebase.firestore.FieldValue.serverTimestamp()
        }, { merge: true })
        .then(() => {
          if (!silent) showToast("Đã lưu và đồng bộ dữ liệu lên Firebase thành công!");
        })
        .catch(err => console.warn("Lưu Firestore bị lỗi:", err));
      } else {
        if (!silent) showToast("Đã lưu vào bộ nhớ cục bộ (Offline)!");
      }
    }

    function showToast(msg) {
      const toast = document.createElement("div");
      toast.className = "fixed bottom-5 right-5 z-50 bg-emerald-600 text-white font-bold text-xs px-4 py-2.5 rounded-lg shadow-xl flex items-center space-x-2 animate-bounce";
      toast.innerHTML = `<i class="fa-solid fa-circle-check"></i><span>${msg}</span>`;
      document.body.appendChild(toast);
      setTimeout(() => toast.remove(), 2500);
    }

    if (db) {
      db.collection("daily_reports").doc("system_config").onSnapshot(doc => {
        if (doc.exists) {
          const cfg = doc.data();
          if (cfg.sites) appData.sites = cfg.sites;
          if (cfg.stage1Template) appData.stage1Template = cfg.stage1Template;
          if (cfg.stage2Template) appData.stage2Template = cfg.stage2Template;
          if (cfg.users) {
            appData.users = cfg.users;
            if (currentUser) {
              const me = appData.users.find(x => x.u === currentUser.u);
              if (me) {
                currentUser = { ...me };
                localStorage.setItem("ventech_user", JSON.stringify(currentUser));
                renderAuthInfo();
              }
            }
          }
          localStorage.setItem("ventech_db", JSON.stringify(appData));
          renderMain();
        }
      });

      db.collection("daily_reports").doc(selectedDate).onSnapshot(doc => {
        if (doc.exists) {
          const data = doc.data();
          if (data && data.reports) {
            appData.reports[selectedDate] = data.reports;
            localStorage.setItem("ventech_db", JSON.stringify(appData));
            renderMain();
          }
        }
      }, err => console.warn("Firebase listener:", err.message));
    }

    window.addEventListener("DOMContentLoaded", () => {
      document.getElementById("top-logo-img").src = VENTECH_LOGO_BASE64;
      renderAuthInfo();
      renderMain();
    });

    // CHỈ CHO PHÉP SUPER ADMIN MỞ MODAL SỬA TÀI KHOẢN
    function renderAuthInfo() {
      const box = document.getElementById("auth-info");
      if (!currentUser) {
        box.innerHTML = `<span class="text-slate-500"><i class="fa-solid fa-lock mr-1"></i>Hệ thống bảo mật</span>`;
      } else {
        const isSuperAdmin = currentUser.role === "superadmin";

        let badgeColor = "bg-rose-100 text-rose-800 hover:bg-rose-200 cursor-pointer";
        let roleName = "Super Admin";
        if (currentUser.role === "adminsite") {
          badgeColor = "bg-purple-100 text-purple-800 cursor-default";
          roleName = "Admin Site";
        } else if (currentUser.role === "site") {
          badgeColor = "bg-sky-100 text-sky-800 cursor-default";
          roleName = "Site Kỹ Thuật";
        }

        box.innerHTML = `
          <div class="flex items-center space-x-2">
            ${isSuperAdmin ? `
              <button onclick="openProfileModal()" title="Bấm để xem và sửa thông tin tài khoản Super Admin" class="${badgeColor} font-bold px-3 py-1.5 rounded-full text-xs transition flex items-center space-x-1.5 shadow-sm border border-slate-200">
                <i class="fa-solid fa-circle-user text-sm"></i>
                <span>${currentUser.name} (${roleName})</span>
                <i class="fa-solid fa-gear text-[11px] ml-0.5 text-slate-500"></i>
              </button>
            ` : `
              <div title="Tài khoản này do Super Admin quản lý" class="${badgeColor} font-bold px-3 py-1.5 rounded-full text-xs flex items-center space-x-1.5 border border-slate-200">
                <i class="fa-solid fa-circle-user text-sm"></i>
                <span>${currentUser.name} (${roleName})</span>
              </div>
            `}
            <button onclick="handleLogout()" class="text-rose-600 hover:text-rose-700 bg-rose-50 hover:bg-rose-100 px-2.5 py-1.5 rounded text-xs transition">
              <i class="fa-solid fa-arrow-right-from-bracket mr-1"></i>Đăng xuất
            </button>
          </div>
        `;
      }
    }

    function handleLogout() {
      currentUser = null;
      inspectingSiteId = null;
      localStorage.removeItem("ventech_user");
      renderAuthInfo();
      renderMain();
    }

    function renderMain() {
      const main = document.getElementById("main-container");
      if (!currentUser) {
        renderLoginView(main);
        return;
      }

      if (inspectingSiteId) {
        renderSiteInspectorView(main, inspectingSiteId);
        return;
      }

      if (currentUser.role === "superadmin" || currentUser.role === "adminsite") {
        renderAdminDashboard(main);
      } else {
        renderSiteWorkerDashboard(main, currentUser.siteId);
      }
    }

    function renderLoginView(container) {
      container.innerHTML = `
        <div class="max-w-md mx-auto mt-12 bg-white rounded-xl shadow-md border border-slate-200 overflow-hidden">
          <div class="p-6 text-center border-b border-slate-100">
            <img src="${VENTECH_LOGO_BASE64}" class="h-12 mx-auto mb-3 object-contain" alt="Ventech">
            <h2 class="text-lg font-bold text-slate-800 uppercase">Hệ Thống Báo Cáo Tiến Độ</h2>
            <p class="text-xs text-slate-500">Dự án Giám Sát Camera & Cáp Quang Trại Miền Trung</p>
          </div>
          <div class="p-6 space-y-4">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Tài khoản đăng nhập</label>
              <input type="text" id="login-user" placeholder="admin, adminsite1 hoặc mã site" class="w-full text-sm px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-1">Mật khẩu</label>
              <input type="password" id="login-pass" placeholder="Nhập mật khẩu" class="w-full text-sm px-3 py-2.5 border border-slate-300 rounded-lg focus:ring-2 focus:ring-sky-500 outline-none">
            </div>
            <button onclick="handleLoginSubmit()" class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-sm mt-2">
              <i class="fa-solid fa-right-to-bracket mr-1.5"></i>Đăng Nhập Vào Hệ Thống
            </button>
          </div>
        </div>
      `;
    }

    function handleLoginSubmit() {
      const u = document.getElementById("login-user").value.trim().toLowerCase();
      const p = document.getElementById("login-pass").value.trim();

      if (!u || !p) return alert("Vui lòng nhập đầy đủ tài khoản và mật khẩu!");

      const foundUser = appData.users.find(x => (x.u.toLowerCase() === u || (x.code && x.code.toLowerCase() === u)) && x.p === p);
      if (foundUser) {
        currentUser = { ...foundUser };
        localStorage.setItem("ventech_user", JSON.stringify(currentUser));
        inspectingSiteId = null;
        renderAuthInfo();
        renderMain();
      } else {
        alert("Sai tên đăng nhập hoặc mật khẩu!");
      }
    }

    // DASHBOARD CHỈ HUY TRƯỞNG & ADMIN SITE
    function renderAdminDashboard(container) {
      ensureDayReport(selectedDate);
      const dayRep = appData.reports[selectedDate];

      let visibleSites = appData.sites;
      if (currentUser.role === "adminsite") {
        visibleSites = appData.sites.filter(s => currentUser.allowedSites && currentUser.allowedSites.includes(s.id));
      }

      const totalSites = visibleSites.length;
      const submittedSites = visibleSites.filter(s => dayRep[s.id] && dayRep[s.id].submitted).length;

      let filteredSites = visibleSites.filter(s => {
        const rep = dayRep[s.id];
        if (siteFilterStatus === "submitted" && (!rep || !rep.submitted)) return false;
        if (siteFilterStatus === "pending" && rep && rep.submitted) return false;

        if (siteSearchKeyword.trim()) {
          const kw = removeVietnameseTones(siteSearchKeyword.trim().toLowerCase());
          const matchName = removeVietnameseTones((s.name || "").toLowerCase()).includes(kw);
          const matchCode = (s.code || "").toString().toLowerCase().includes(kw);
          const matchTech = removeVietnameseTones((s.tech || "").toLowerCase()).includes(kw);
          const matchId = (s.id || "").toLowerCase().includes(kw);
          return matchName || matchCode || matchTech || matchId;
        }
        return true;

            <div class="flex flex-wrap items-center gap-2">

                <button onclick="openEditStagesModal()" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white font-semibold px-3 py-2 rounded shadow-sm transition">
                  <i class="fa-solid fa-list-check mr-1"></i>Sửa Nội Dung Giai Đoạn
                </button>
              ` : ''}
              <button onclick="copyZaloSummary()" class="text-xs bg-teal-600 hover:bg-teal-700 text-white font-medium px-3 py-2 rounded shadow-sm transition">
                <i class="fa-solid fa-copy mr-1"></i>Copy Zalo
              </button>
              <button onclick="exportWordReport()" class="text-xs bg-blue-600 hover:bg-blue-700 text-white font-medium px-3 py-2 rounded shadow-sm transition">
                <i class="fa-solid fa-file-word mr-1"></i>Xuất Word
              </button>
              <button onclick="triggerPrintPDF()" class="text-xs bg-slate-700 hover:bg-slate-800 text-white font-medium px-3 py-2 rounded shadow-sm transition">
                <i class="fa-solid fa-print mr-1"></i>In / PDF
              </button>
            </div>
          </div>

          <!-- THẺ CHỈ SỐ -->
          <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
              <div class="text-xs text-slate-500 font-medium">Tiến độ nộp báo cáo</div>
              <div class="text-2xl font-black text-sky-600 mt-1">${submittedSites} / ${totalSites} <span class="text-xs font-normal text-slate-400">Trại</span></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
              <div class="text-xs text-slate-500 font-medium">Tiến độ GĐ1 Trung Bình</div>
              <div class="text-2xl font-black text-emerald-600 mt-1">${calculateAvgStage1Global(visibleSites)}%</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
              <div class="text-xs text-slate-500 font-medium">Tiến độ GĐ2 Trung Bình</div>
              <div class="text-2xl font-black text-amber-600 mt-1">${calculateAvgStage2Global(visibleSites)}%</div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm text-center">
              <div class="text-xs text-slate-500 font-medium">Tổng ảnh ghi nhận</div>
              <div class="text-2xl font-black text-indigo-600 mt-1">${countTotalPhotos(visibleSites)} <span class="text-xs font-normal text-slate-400">Ảnh</span></div>
            </div>
          </div>

          <!-- KHUNG TÌM KIẾM VÀ BỘ LỌC TRẠI -->
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3">
            <div class="relative flex-1 max-w-lg">
              <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                <i class="fa-solid fa-magnifying-glass"></i>
              </span>
              <input type="text" id="site-search-input" value="${siteSearchKeyword}" oninput="handleSearchSite(this.value)" placeholder="Tìm kiếm theo Tên trại, Mã site (vd: 19, 22), hoặc Kỹ thuật viên..." class="w-full text-xs pl-9 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-lg outline-none focus:bg-white focus:ring-2 focus:ring-sky-500 transition">
              ${siteSearchKeyword ? `
                <button onclick="clearSearchSite()" class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-600 text-sm">&times;</button>

            </div>

              <span class="font-bold text-slate-500 mr-1 text-[11px] uppercase">Lọc:</span>
              <button onclick="setFilterStatus('all')" class="px-3 py-1.5 rounded-lg font-semibold transition ${siteFilterStatus === 'all' ? 'bg-slate-800 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                Tất cả (${visibleSites.length})
              </button>
              <button onclick="setFilterStatus('submitted')" class="px-3 py-1.5 rounded-lg font-semibold transition ${siteFilterStatus === 'submitted' ? 'bg-emerald-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                Đã nộp (${submittedSites})
              </button>
              <button onclick="setFilterStatus('pending')" class="px-3 py-1.5 rounded-lg font-semibold transition ${siteFilterStatus === 'pending' ? 'bg-amber-600 text-white shadow-sm' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                Chưa nộp (${totalSites - submittedSites})
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between text-xs text-slate-500 px-1">
            <span>Hiển thị <strong>${filteredSites.length}</strong> / ${visibleSites.length} trại phù hợp</span>
            ${siteSearchKeyword || siteFilterStatus !== 'all' ? `
              <button onclick="resetAllFilters()" class="text-sky-600 hover:underline">Xóa tất cả bộ lọc</button>
            ` : ''}
          </div>

          <!-- DANH SÁCH SITE -->
          ${filteredSites.length === 0 ? `
            <div class="bg-white p-12 text-center rounded-xl border border-slate-200 shadow-sm text-slate-400">
              <i class="fa-solid fa-magnifying-glass text-4xl mb-3 text-slate-300"></i>
              <p class="text-sm font-semibold text-slate-600">Không tìm thấy trại thi công nào phù hợp!</p>
              <p class="text-xs mt-1">Hãy thử tìm với từ khóa khác hoặc bấm <button onclick="resetAllFilters()" class="text-sky-600 underline font-semibold">xóa bộ lọc</button>.</p>
            </div>
          ` : `
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
              ${filteredSites.map(site => renderAdminSiteCard(site, dayRep[site.id])).join("")}
            </div>
          `}
        </div>
      `;
    }

    function removeVietnameseTones(str) {
      if (!str) return "";
      str = str.replace(/à|á|ạ|ả|ã|â|ầ|ấ|ậ|ẩ|ẫ|ă|ằ|ắ|ặ|ẳ|ẵ/g, "a");
      str = str.replace(/è|é|ẹ|ẻ|ẽ|ê|ề|ế|ệ|ể|ễ/g, "e");
      str = str.replace(/ì|í|ị|ỉ|ĩ/g, "i");
      str = str.replace(/ò|ó|ọ|ỏ|õ|ô|ồ|ố|ộ|ổ|ỗ|ơ|ờ|ớ|ợ|ở|ỡ/g, "o");
      str = str.replace(/ù|ú|ụ|ủ|ũ|ư|ừ|ứ|ự|ử|ữ/g, "u");
      str = str.replace(/ỳ|ý|ỵ|ỷ|ỹ/g, "y");
      str = str.replace(/đ/g, "d");
      str = str.replace(/\u0300|\u0301|\u0303|\u0309|\u0323/g, "");
      str = str.replace(/\u02C6|\u0306|\u031B/g, "");
      return str;
    }

    function handleSearchSite(val) {
      siteSearchKeyword = val;
      renderMain();
      const input = document.getElementById("site-search-input");
      if (input) {
        input.focus();
        input.setSelectionRange(val.length, val.length);
      }
    }

    function clearSearchSite() {
      siteSearchKeyword = "";
      renderMain();
    }

    function setFilterStatus(status) {
      siteFilterStatus = status;
      renderMain();
    }

    function resetAllFilters() {
      siteSearchKeyword = "";
      siteFilterStatus = "all";
      renderMain();
    }

    function calculateAvgStage1Global(siteList) {
      const dayRep = appData.reports[selectedDate];
      if (!dayRep) return 100;
      let sum = 0, count = 0;
      siteList.forEach(s => {
        if (dayRep[s.id] && dayRep[s.id].stagesEnabled?.stage1 !== false) {
          sum += calculateSiteAvgStage1(dayRep[s.id]);
          count++;
        }
      });
      return count ? Math.round(sum / count) : 100;
    }

    function calculateAvgStage2Global(siteList) {
      const dayRep = appData.reports[selectedDate];
      if (!dayRep) return 0;
      let sum = 0, count = 0;
      siteList.forEach(s => {
        if (dayRep[s.id] && dayRep[s.id].stagesEnabled?.stage2 !== false) {
          sum += calculateSiteAvgStage2(dayRep[s.id]);
          count++;
        }
      });
      return count ? Math.round(sum / count) : 0;
    }

    function countTotalPhotos(siteList) {
      const dayRep = appData.reports[selectedDate];
      if (!dayRep) return 0;
      return siteList.reduce((acc, s) => acc + (dayRep[s.id]?.images ? dayRep[s.id].images.length : 0), 0);
    }

    function renderAdminSiteCard(site, rep) {
      const s1Avg = calculateSiteAvgStage1(rep);
      const s2Avg = calculateSiteAvgStage2(rep);
      const isDone = rep.submitted;
      const imgCount = rep.images ? rep.images.length : 0;
      const stg = rep.stagesEnabled || { stage1: true, stage2: true };

      return `
        <div class="bg-white rounded-xl border ${isDone ? 'border-emerald-200 ring-1 ring-emerald-100' : 'border-slate-200'} p-5 shadow-sm flex flex-col justify-between">
          <div>
            <div class="flex items-center justify-between border-b border-slate-100 pb-2 mb-3">
              <div>
                <span class="text-xs font-bold text-sky-600">#SITE ${site.code}</span>
                <h3 class="font-bold text-slate-800 text-base leading-tight">${site.name}</h3>
                <p class="text-xs text-slate-500">Phụ trách: ${site.tech} (${site.phone || 'N/A'})</p>
              </div>
              <span class="text-xs font-semibold px-2 py-0.5 rounded-full ${isDone ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                ${isDone ? '<i class="fa-solid fa-circle-check mr-1"></i>Đã nộp' : '<i class="fa-solid fa-clock mr-1"></i>Chưa nộp'}
              </span>
            </div>

            <!-- BẬT TẮT GIAI ĐOẠN -->
            <div class="flex items-center justify-between bg-slate-50 p-2 rounded-lg mb-3 text-xs">
              <span class="font-bold text-slate-600">Giai đoạn kích hoạt:</span>
              <div class="flex items-center space-x-2">
                <button onclick="toggleStage('${site.id}', 'stage1')" class="px-2 py-0.5 rounded font-semibold transition ${stg.stage1 !== false ? 'bg-emerald-600 text-white' : 'bg-slate-200 text-slate-500 line-through'}">GĐ1</button>
                <button onclick="toggleStage('${site.id}', 'stage2')" class="px-2 py-0.5 rounded font-semibold transition ${stg.stage2 !== false ? 'bg-sky-600 text-white' : 'bg-slate-200 text-slate-500 line-through'}">GĐ2</button>
              </div>
            </div>

            <div class="space-y-2 mb-4">
              ${stg.stage1 !== false ? `
                <div>
                  <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                    <span>GĐ 1: Hoàn thành thiết bị cơ bản</span>
                    <span class="text-emerald-600 font-bold">${s1Avg}%</span>
                  </div>
                  <div class="w-full bg-slate-100 rounded-full h-2">
                    <div class="bg-emerald-500 h-2 rounded-full transition-all duration-300" style="width: ${s1Avg}%"></div>
                  </div>
                </div>
              ` : `
                <div class="text-[11px] text-slate-400 italic py-1 border-b border-dashed border-slate-200">
                  <i class="fa-solid fa-ban mr-1"></i>Giai đoạn 1 đã tạm tắt
                </div>
              `}

              ${stg.stage2 !== false ? `
                <div>
                  <div class="flex justify-between text-xs font-medium text-slate-600 mb-1">
                    <span>GĐ 2: Hoàn thiện cáp & nghiệm thu</span>
                    <span class="text-sky-600 font-bold">${s2Avg}%</span>
                  </div>
                  <div class="w-full bg-slate-100 rounded-full h-2">
                    <div class="bg-sky-500 h-2 rounded-full transition-all duration-300" style="width: ${s2Avg}%"></div>
                  </div>
                </div>
              ` : `
                <div class="text-[11px] text-slate-400 italic py-1 border-b border-dashed border-slate-200">
                  <i class="fa-solid fa-ban mr-1"></i>Giai đoạn 2 đã tạm tắt
                </div>
              `}
            </div>

            <div class="bg-slate-50 p-2.5 rounded text-xs text-slate-600 space-y-1 mb-4">
              <div><strong>Ảnh ghi nhận:</strong> ${imgCount} ảnh</div>
              <div class="truncate"><strong>Kế hoạch:</strong> ${rep.planNext || 'Chưa cập nhật'}</div>
            </div>
          </div>

          <div class="space-y-2">
            <button onclick="downloadSiteImagesZip('${site.id}')" class="w-full text-center text-xs bg-amber-50 hover:bg-amber-100 text-amber-800 font-semibold py-2 rounded transition">
              <i class="fa-solid fa-file-zipper mr-1"></i>Tải Toàn Bộ Ảnh (.ZIP)
            </button>
            <button onclick="openSiteInspector('${site.id}')" class="w-full text-center text-xs bg-sky-50 hover:bg-sky-100 text-sky-700 font-semibold py-2 rounded transition">
              <i class="fa-solid fa-pen-to-square mr-1"></i>Xem & Chỉnh Sửa Trại Này
            </button>

    function toggleStage(siteId, stageKey) {
      const rep = appData.reports[selectedDate][siteId];
      if (!rep.stagesEnabled) rep.stagesEnabled = { stage1: true, stage2: true };
      rep.stagesEnabled[stageKey] = !rep.stagesEnabled[stageKey];
      saveAllData(true);
      renderMain();
    }

    function openSiteInspector(siteId) {
      inspectingSiteId = siteId;
      renderMain();
    }

    function closeSiteInspector() {
      inspectingSiteId = null;
      renderMain();
    }

    function handleImageUpload(siteId, files) {
      if (!files || !files.length) return;
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxDim = 1000;
            let w = img.width, h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = (h * maxDim) / w; w = maxDim; }
              else { w = (w * maxDim) / h; h = maxDim; }
            }
            canvas.width = w; canvas.height = h;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, w, h);
            const compressed = canvas.toDataURL("image/jpeg", 0.75);

            if (!appData.reports[selectedDate][siteId].images) {
              appData.reports[selectedDate][siteId].images = [];
            }
            appData.reports[selectedDate][siteId].images.push({
              src: compressed,
              caption: "Thi công hoàn thiện camera và cáp quang"
            });
            saveAllData(true);
            renderMain();
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function updateImageCaption(siteId, idx, caption) {
      appData.reports[selectedDate][siteId].images[idx].caption = caption;
      saveAllData(true);
    }

    function removeImage(siteId, idx) {

    function downloadSiteImagesZip(siteId) {
      const site = appData.sites.find(s => s.id === siteId);
      const rep = appData.reports[selectedDate][siteId];
      const imgs = rep ? rep.images || [] : [];

      if (!imgs.length) return alert(`Trại ${site.name} chưa có hình ảnh nào trong ngày ${selectedDate}!`);
      if (typeof JSZip === "undefined") return alert("Thư viện JSZip đang tải, vui lòng thử lại sau!");

      const zip = new JSZip();
      let textLog = `DANH SÁCH HÌNH ẢNH HIỆN TRƯỜNG\nSite: ${site.name}\nNgày: ${selectedDate}\nTổng số ảnh: ${imgs.length}\n-----------------------------------\n`;

      imgs.forEach((img, idx) => {
        const base64Data = img.src.split(",")[1];
        const numStr = (idx + 1).toString().padStart(2, "0");
        const cleanCaption = (img.caption || "Hinh_anh_thi_cong").replace(/[^a-zA-Z0-9_\u00C0-\u024F\u1E00-\u1EFF]/g, "_");
        const filename = `${numStr}_${site.id}_${selectedDate}_${cleanCaption}.jpg`;

        zip.file(filename, base64Data, { base64: true });
        textLog += `${numStr}. ${filename}\n   Chú thích: ${img.caption || "Không có chú thích"}\n\n`;
      });

      zip.file("Danh_sach_chu_thich.txt", textLog);

      zip.generateAsync({ type: "blob" }).then(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Anh_Hien_Truong_${site.id}_${selectedDate}.zip`;
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    function startVoiceAssistant(siteId) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("Trình duyệt không hỗ trợ nhận diện giọng nói! Hãy dùng Google Chrome.");
      const recognition = new SpeechRecognition();
      recognition.lang = "vi-VN";
      recognition.start();

      alert("Đang lắng nghe giọng nói tiếng Việt... Hãy nói: 'Hôm nay trời mưa khó kéo cáp' hoặc 'Ngày mai cấu hình camera'");

      recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        if (text.includes("mưa") || text.includes("khó khăn") || text.includes("cách ly")) {
          appData.reports[selectedDate][siteId].issues += "\n- " + text;
        } else {
          appData.reports[selectedDate][siteId].planNext += "\n- " + text;
        }
        saveAllData(true);
        renderMain();
      };
    }

    function saveUserProfile() {
      if (!currentUser || currentUser.role !== "superadmin") return;
      const newName = document.getElementById("prof-name").value.trim();
      const newU = document.getElementById("prof-u").value.trim().toLowerCase();
      const newP = document.getElementById("prof-p").value.trim();

      if (!newName || !newU || !newP) {
        return alert("Vui lòng không để trống họ tên, tài khoản và mật khẩu!");
      }

      const exist = appData.users.find(x => x.u.toLowerCase() === newU && x.u.toLowerCase() !== currentUser.u.toLowerCase());
      if (exist) {
        return alert("Tên đăng nhập này đã có người sử dụng, vui lòng chọn tên khác!");
      }

      const targetUser = appData.users.find(x => x.u.toLowerCase() === currentUser.u.toLowerCase());
      if (targetUser) {
        targetUser.name = newName;
        targetUser.u = newU;
        targetUser.p = newP;
      }

      currentUser.name = newName;
      currentUser.u = newU;
      currentUser.p = newP;
      localStorage.setItem("ventech_user", JSON.stringify(currentUser));

      saveAllData(false);
      closeModal();
      renderAuthInfo();
      renderMain();
      showToast("Đã cập nhật thông tin Super Admin thành công!");
    }

    function getSitePass(siteId) {
      const u = appData.users.find(x => x.siteId === siteId || x.u === siteId);
      return u ? u.p : "123456";
    }

    function handleSaveSite(editIdx) {
      const code = document.getElementById("site-new-code").value.trim();
      const name = document.getElementById("site-new-name").value.trim();
      const tech = document.getElementById("site-new-tech").value.trim();
      const phone = document.getElementById("site-new-phone").value.trim();
      const pass = document.getElementById("site-new-pass").value.trim() || "123456";
      let id = document.getElementById("site-new-id").value.trim().toLowerCase();

      if (!code || !name || !tech) {
        return alert("Vui lòng điền đầy đủ: Mã site, Tên trại và Người phụ trách!");
      }

      if (editIdx !== null) {
        const s = appData.sites[editIdx];
        s.code = code;
        s.name = name;
        s.tech = tech;
        s.phone = phone;

        const u = appData.users.find(x => x.siteId === s.id || x.u === s.id);
        if (u) {
          u.name = name;
          u.code = code;
          u.p = pass;
        }

        saveAllData(false);
        alert(`Đã cập nhật thông tin trại ${name} thành công!`);
        openManageSitesModal();
        renderMain();
      } else {
        if (!id) {
          id = name.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
        }

        if (appData.sites.some(x => x.id === id || x.code === code)) {
          return alert("Mã số site hoặc tên đăng nhập này đã bị trùng!");
        }

        const newSiteObj = { id, code, name, tech, phone };
        appData.sites.push(newSiteObj);

        if (!appData.users.some(x => x.u === id)) {
          appData.users.push({
            u: id,
            p: pass,
            role: "site",
            siteId: id,
            name: name,
            code: code
          });
        }

        ensureDayReport(selectedDate);
        saveAllData(false);
        alert(`Đã tạo thành công ${name} (#Site ${code})!`);
        openManageSitesModal();
        renderMain();
      }
    }

    function deleteSite(idx) {
      const s = appData.sites[idx];
      if (confirm(`Bạn có chắc chắn muốn xóa "${s.name}"? Dữ liệu của site này sẽ bị gỡ bỏ.`)) {
        appData.sites.splice(idx, 1);
        appData.users = appData.users.filter(x => x.siteId !== s.id);
        appData.users.forEach(u => {
          if (u.allowedSites) {
            u.allowedSites = u.allowedSites.filter(siteId => siteId !== s.id);
          }
        });
        saveAllData(false);
        openManageSitesModal();
        renderMain();
      }
    }

    function handleSaveUser(editIdx) {
      const u = document.getElementById("new-u").value.trim().toLowerCase();
      const p = document.getElementById("new-p").value.trim();
      const name = document.getElementById("new-name").value.trim();
      const role = document.getElementById("new-role").value;

      if (!u || !p || !name) return alert("Vui lòng điền đầy đủ tên đăng nhập, mật khẩu và tên hiển thị!");

      let allowedSites = [];
      if (role === "superadmin") {
        allowedSites = ["*"];
      } else {
        const cbs = document.querySelectorAll(".site-cb:checked");
        allowedSites = Array.from(cbs).map(c => c.value);
        if (!allowedSites.length && role === "adminsite") {
          return alert("Vui lòng chọn ít nhất 1 site cho Admin này quản lý!");
        }
      }

      if (editIdx !== null) {
        const target = appData.users[editIdx];
        target.u = u;
        target.p = p;
        target.name = name;
        target.role = role;
        target.allowedSites = allowedSites;
        if (role === "site" && allowedSites.length) {
          target.siteId = allowedSites[0];
        }

        if (currentUser && currentUser.u.toLowerCase() === target.u.toLowerCase()) {
          currentUser = { ...target };
          localStorage.setItem("ventech_user", JSON.stringify(currentUser));
        }

        saveAllData(false);
        alert(`Đã cập nhật thông tin tài khoản ${name} thành công!`);
        openManageUsersModal();
        renderAuthInfo();
        renderMain();
      } else {
        if (appData.users.some(x => x.u === u)) return alert("Tên đăng nhập này đã tồn tại!");

        const newObj = { u, p, name, role, allowedSites };
        if (role === "site" && allowedSites.length) {
          newObj.siteId = allowedSites[0];
        }
        appData.users.push(newObj);
        saveAllData(false);
        alert(`Đã tạo tài khoản ${name} thành công!`);
        openManageUsersModal();
        renderAuthInfo();
      }
    }

    function deleteUser(idx) {
      if (confirm("Bạn có chắc muốn xóa tài khoản này?")) {
        appData.users.splice(idx, 1);
        saveAllData(false);
        openManageUsersModal();
      }
    }

    function updateStageItem(stageKey, idx, field, val) {
      if (stageKey === 'stage1') appData.stage1Template[idx][field] = val;
      else appData.stage2Template[idx][field] = val;
    }

    function addNewItemToStage(stageKey) {
      if (stageKey === 'stage1') {
        const nextCode = "I." + (appData.stage1Template.length + 1);
        appData.stage1Template.push({ code: nextCode, name: "Hạng mục công việc mới", default: 100 });
      } else {
        const nextCode = "II." + (appData.stage2Template.length + 1);
        appData.stage2Template.push({ code: nextCode, name: "Hạng mục hoàn thiện mới", default: 0 });
      }
      openEditStagesModal();
    }

    function removeStageItem(stageKey, idx) {
      if (confirm("Bạn có chắc muốn xóa hạng mục này?")) {
        if (stageKey === 'stage1') appData.stage1Template.splice(idx, 1);
        else appData.stage2Template.splice(idx, 1);
        openEditStagesModal();
      }
    }

    function saveStageEdits() {
      saveAllData(false);
      alert("Đã lưu các thay đổi nội dung giai đoạn thành công!");
      closeModal();
      renderMain();
    }

    function closeModal() {
      document.getElementById("modal-container").classList.add("hidden");
    }

    // ==========================================
    // TÍNH NĂNG XUẤT BẢN: ZALO, WORD (.DOC), IN A4
    // ==========================================
    function copyZaloSummary() {
      const dayRep = appData.reports[selectedDate];
      let msg = `*BÁO CÁO TIẾN ĐỘ THI CÔNG NGÀY ${selectedDate} - DỰ ÁN CP*\n`;
      msg += `Đơn vị: VENTECH (VENUS NETWORKS TECHNOLOGY)\n\n`;

      appData.sites.forEach(site => {
        const rep = dayRep[site.id];
        const stg = rep.stagesEnabled || { stage1: true, stage2: true };
        const s1Avg = calculateSiteAvgStage1(rep);
        const s2Avg = calculateSiteAvgStage2(rep);
        
        let progressStr = [];
        if (stg.stage1 !== false) progressStr.push(`GĐ1: ${s1Avg}%`);
        if (stg.stage2 !== false) progressStr.push(`GĐ2: ${s2Avg}%`);

        msg += `📍 *${site.name}*:\n`;
        msg += `  • Tiến độ: ${progressStr.length ? progressStr.join(" | ") : "Chưa kích hoạt"}\n`;
        msg += `  • Ảnh: ${rep.images ? rep.images.length : 0} ảnh đính kèm\n`;
      });

      msg += `\n👉 Ghi chú: Quy trình cách ly bảo đảm, kiểm tra đấu nối đúng tiêu chuẩn C.P.`;

      navigator.clipboard.writeText(msg).then(() => {
        alert("Đã sao chép nội dung báo cáo! Bạn có thể dán (Paste) ngay vào nhóm chat Zalo.");
      }).catch(() => prompt("Sao chép thủ công nội dung dưới đây:", msg));
    }

      let content = `
        <html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>

            th, td { border: 1px solid #000; padding: 6px; font-size: 11pt; }
            th { background-color: #f2f2f2; text-align: center; }
            h2, h3, h4 { margin-top: 15px; margin-bottom: 5px; text-decoration: none !important; border-bottom: none !important; }

        </head>
        <body>
          <table style="border: none; margin-bottom: 20px;">
            <tr style="border: none;">
              <td style="border: none; width: 40%; vertical-align: middle;">
                <img src="${VENTECH_LOGO_BASE64}" width="220" alt="Ventech Logo">
              </td>
              <td style="border: none; text-align: right; vertical-align: middle;">
                <strong>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</strong><br>
                Độc lập - Tự do - Hạnh phúc<br>
                <em>Ngày ${selectedDate.split("-").reverse().join(" tháng ")} năm ${selectedDate.split("-")[0]}</em>
              </td>
            </tr>
          </table>

          <div style="text-align: center; margin-bottom: 20px;">
            <h2 style="margin: 0; font-size: 16pt;">BÁO CÁO TIẾN ĐỘ HIỆN TRƯỜNG CÁC TRẠI MIỀN TRUNG</h2>
            <div style="font-size: 12pt; margin-top: 4px;">Dự án: C.P | Đơn vị thi công: VENTECH</div>
          </div>

          <h3>1. HẠNG MỤC TRIỂN KHAI CHÍNH</h3>
          <ul>
            <li>Tiến hành tập kết nhân sự và thực hiện quy trình cách ly 24h - 48h.</li>
            <li>Bàn giao và nhập vật tư, cáp quang vào trại.</li>
            <li>Dựng trụ đỡ cáp quang cho các vị trí chính theo quy cách tiêu chuẩn của C.P.</li>
            <li>Treo ống cứng PVC, luồn cáp mạng Cat6 vào ống, kéo cáp quang chính.</li>
            <li>Hàn quang, đấu nối chính thức tủ Rack trung tâm và tủ EB.</li>
            <li>Cấu hình hệ thống và lên hình camera giám sát.</li>
          </ul>

          <h3>2. BẢNG THEO DÕI TIẾN ĐỘ CHI TIẾT CÁC SITE</h3>
          <table>
            <thead>
              <tr>
                <th style="width: 8%;">STT</th>
                <th>Nội Dung Công Việc Thực Hiện</th>
                <th style="width: 15%;">Tỷ Lệ (%)</th>
                <th style="width: 30%;">Ghi Chú</th>
              </tr>
            </thead>
            <tbody>
              ${appData.sites.map(site => {
                const rep = dayRep[site.id];
                const stg = rep.stagesEnabled || { stage1: true, stage2: true };
                let rows = `
                  <tr style="background-color: #e6f0fa; font-weight: bold;">
                    <td style="text-align: center;">${site.code}</td>
                    <td colspan="3">${site.name}</td>
                  </tr>
                `;

                if (stg.stage1 !== false) {
                  rows += `
                    <tr style="background-color: #f8fafc; font-weight: bold; font-style: italic;">
                      <td style="text-align: center;">GĐ 1</td>
                      <td colspan="3">Lắp đặt thiết bị và hạ tầng cơ bản</td>

                    ${appData.stage1Template.map(item => `
                      <tr>
                        <td style="text-align: center;">${item.code}</td>
                        <td>${item.name}</td>
                        <td style="text-align: center; font-weight: bold;">${rep.stage1[item.code] !== undefined ? rep.stage1[item.code] : 100}%</td>

                  `;
                }

                if (stg.stage2 !== false) {
                  rows += `
                    <tr style="background-color: #f8fafc; font-weight: bold; font-style: italic;">
                      <td style="text-align: center;">GĐ 2</td>
                      <td colspan="3">Hoàn thiện cáp quang & nghiệm thu</td>

                    ${appData.stage2Template.map(item => `

                }

          </table>

          <h3>3. HÌNH ẢNH HIỆN TRƯỜNG THỰC TẾ</h3>

            let imgRows = "";

              const img1 = imgs[i];
              const img2 = imgs[i + 1];
              imgRows += `

            return `

              <table style="border: none;">${imgRows}</table>

          <h3>4. KHÓ KHĂN - RỦI RO - HƯỚNG GIẢI QUYẾT</h3>
          <ul>
            <li>Quy trình khử khuẩn và cách ly tại trại mất từ 24h - 48h trước khi được vào khu nuôi.</li>
            <li>Khoảng cách địa lý di chuyển giữa các trại tại Gia Lai tương đối xa.</li>
            <li>Thời tiết mưa chiều ảnh hưởng đến việc căng cáp trên trụ bê tông cao.</li>
          </ul>

          <h3>5. CÔNG VIỆC DỰ KIẾN KẾ TIẾP</h3>
          <ul>
            <li>Tiếp tục thi công kéo cáp quang và căng cáp chịu lực các tuyến còn lại.</li>
            <li>Đấu nối hộp phối quang ODF, bấm đầu dây và hoàn thiện tủ EB.</li>
            <li>Kiểm tra lên hình camera toàn tuyến chuẩn bị nghiệm thu nội bộ.</li>
          </ul>
        </body>
        </html>
      `;

      const blob = new Blob(['\ufeff', content], { type: 'application/msword' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Bao_Cao_Tien_Do_Ventech_CP_${selectedDate}.doc`;
      a.click();
    }
